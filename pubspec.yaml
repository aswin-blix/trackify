name: trackify
description: A production-grade expense tracking app with glassmorphism UI.
publish_to: 'none'
# Keep kAppVersion in lib/core/constants/app_constants.dart in sync.
version: 1.5.0+6

environment:
  # NOTE: raising the Dart lower bound to >=3.7 switches `dart format` to the
  # tall style and reformats the whole repo. Do that in its own commit.
  sdk: '>=3.0.0 <4.0.0'
  # pubspec.lock already requires this; older Flutter SDKs never built.
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^1.2.0

  # Animations
  flutter_animate: ^4.5.0

  # Notifications
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.0.2
  timezone: ^0.11.0

  # Permissions
  permission_handler: ^12.0.1

  # File operations
  path_provider: ^2.1.3
  share_plus: ^12.0.2
  file_picker: ^10.3.10

  # Image
  image_picker: ^1.1.2

  # Biometric Auth
  local_auth: ^3.0.1

  # Typography
  google_fonts: ^8.0.2

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.2.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Hive adapters (.g.dart) are checked in. Run
  #   dart run build_runner build --delete-conflicting-outputs
  # only after changing a @HiveType model, then review the diff.
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
